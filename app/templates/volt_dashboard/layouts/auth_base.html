<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Your Name">
  <meta name="description" content="Login Page">
  <title>{% block title %}Login{% endblock %}</title>

  <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="120x120" href="{{ url_for('static', filename='volt_dashboard/assets/img/favicon/apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='volt_dashboard/assets/img/favicon/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='volt_dashboard/assets/img/favicon/favicon-16x16.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='volt_dashboard/assets/img/favicon/site.webmanifest') }}">

  <!-- Volt CSS -->
  <link type="text/css" href="{{ url_for('static', filename='volt_dashboard/assets/css/volt.css') }}" rel="stylesheet">

  <!-- FontAwesome / Bootstrap Icon (optional) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  {% block extra_head %}{% endblock %}
</head>

<body class="bg-soft d-flex align-items-center min-vh-100">

  <div class="container-fluid">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="row justify-content-center mt-4">
          <div class="col-12 col-md-8 col-lg-5">
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          </div>
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <!-- Core -->
  <script src="{{ url_for('static', filename='volt_dashboard/assets/vendor/bootstrap/dist/js/bootstrap.bundle.min.js') }}"></script>

  <!-- Vendor JS -->
  <script src="{{ url_for('static', filename='volt_dashboard/assets/vendor/onscreen/dist/on-screen.umd.min.js') }}"></script>

  <!-- Volt JS -->
  <script src="{{ url_for('static', filename='volt_dashboard/assets/js/volt.js') }}"></script>

  {% block extra_js %}{% endblock %}
</body>

</html>
