{% extends 'volt_dashboard/layouts/base.html' %}
{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center py-4">
    <h2 class="h4">Data Client</h2>
<a href="{{ url_for('client.client_tambah') }}" class="btn btn-primary">+ Tambah Client</a>

</div>

<div class="table-responsive">
    <table class="table table-centered table-hover">
        <thead>
            <tr>
                <th>No</th>
                <th>Nama Client</th>
                <th>Alamat</th>
                <th>Kontak</th>
                <th>Email</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>
            {% for client in clients %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ client.nama_client }}</td>
                <td>{{ client.alamat }}</td>
                <td>{{ client.no_hp }}</td>
                <td>{{ client.email }}</td>
                <td>
                    <a href="{{ url_for('client.client_edit', id=client.id) }}" class="btn btn-sm btn-warning">Edit</a>
                    <form action="{{ url_for('client.client_hapus', id=client.id) }}" method="POST" class="d-inline" onsubmit="return confirm('Yakin hapus?')">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="btn btn-sm btn-danger">Hapus</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
